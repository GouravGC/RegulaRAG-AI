
name: RegulaRAG AI - CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: regularag-cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/gouravgc/regularag-ai
  PYTHONPATH: ${{ github.workspace }}

jobs:
  test-build-publish-deploy:
    name: Test, Build, OCR and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --pull \
            --load \
            -t "$IMAGE_NAME:ci" \
            .

      - name: OCR and Docker smoke test
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            "$IMAGE_NAME:ci" \
            -lc '
              set -e
              echo "Checking startup script..."
              test -f /app/start.sh
              test -x /app/start.sh
              test "$(head -c 2 /app/start.sh)" = "#!"
              bash -n /app/start.sh

              echo "Checking Tesseract OCR..."
              command -v tesseract
              tesseract --version

              echo "Checking Python OCR integration..."
              python -c "import pytesseract; print(\"pytesseract OK\")"

              echo "Docker and OCR smoke tests passed."
            '

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE_NAME:ci" "$IMAGE_NAME:latest"
          docker tag "$IMAGE_NAME:ci" "$IMAGE_NAME:${GITHUB_SHA}"

          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${GITHUB_SHA}"

      - name: Trigger Render deployment
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl --fail --silent --show-error \
              -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Render deployment triggered."
          else
            echo "RENDER_DEPLOY_HOOK_URL is not configured. Skipping."
          fi
