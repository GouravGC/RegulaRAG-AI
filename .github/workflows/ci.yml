
name: RegulaRAG AI - CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: regularag-cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/gouravgc/regularag-ai

jobs:
  test-build-publish-deploy:
    name: Test, Build, OCR and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run automated tests
      - name: Run tests
        run: |
          pytest -q

      # 5. Configure Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6. Build the image for Render-compatible architecture
      - name: Build Docker image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --pull \
            --load \
            -t "$IMAGE_NAME:ci" \
            .

      # 7. Verify startup script and OCR inside the image
      - name: OCR and Docker smoke test
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            "$IMAGE_NAME:ci" \
            -lc '
              set -e
              echo "Checking startup script..."
              test -f /app/start.sh
              test -x /app/start.sh
              test "$(head -c 2 /app/start.sh)" = "#!"
              bash -n /app/start.sh

              echo "Checking Tesseract OCR..."
              command -v tesseract
              tesseract --version

              echo "Checking Python OCR integration..."
              python -c "import pytesseract; print(\"pytesseract OK\")"

              echo "Docker and OCR smoke tests passed."
            '

      # 8. Authenticate with GitHub Container Registry
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 9. Publish image with latest and commit-specific tags
      - name: Publish Docker image to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE_NAME:ci" "$IMAGE_NAME:latest"
          docker tag "$IMAGE_NAME:ci" "$IMAGE_NAME:${GITHUB_SHA}"

          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${GITHUB_SHA}"

          echo "Published:"
          echo "$IMAGE_NAME:latest"
          echo "$IMAGE_NAME:${GITHUB_SHA}"

      # 10. Trigger Render deployment
      - name: Trigger Render deployment
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl --fail --silent --show-error \
              -X POST "$RENDER_DEPLOY_HOOK_URL"

            echo "Render deployment triggered."
          else
            echo "RENDER_DEPLOY_HOOK_URL is not configured."
            echo "Skipping Render deployment."
          fi
