
name: RegulaRAG AI - CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: regularag-cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/gouravgc/regularag-ai
  PYTHONPATH: ${{ github.workspace }}

jobs:
  test-build-publish-deploy:
    name: Test, Build, OCR and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --pull \
            --load \
            -t "$IMAGE_NAME:ci" \
            .

      - name: Docker API and OCR smoke test
        run: |
          set -e

          docker run -d \
            --name regularag-smoke \
            -p 127.0.0.1:8000:10000 \
            "$IMAGE_NAME:ci"

          cleanup() {
            docker logs regularag-smoke || true
            docker rm -f regularag-smoke || true
          }
          trap cleanup EXIT

          echo "Waiting for FastAPI..."

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              echo ""
              echo "FastAPI health check passed."
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              echo "FastAPI did not become healthy."
              exit 1
            fi

            sleep 2
          done

          echo "Checking Tesseract OCR..."
          docker exec regularag-smoke tesseract --version

          echo "Checking Python OCR integration..."
          docker exec regularag-smoke \
            python -c "import pytesseract; print('pytesseract OK')"

          echo "Docker API and OCR smoke tests passed."

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE_NAME:ci" "$IMAGE_NAME:latest"
          docker tag "$IMAGE_NAME:ci" "$IMAGE_NAME:${GITHUB_SHA}"

          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${GITHUB_SHA}"

      - name: Trigger Render deployment
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl --fail --silent --show-error \
              -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Render deployment triggered."
          else
            echo "RENDER_DEPLOY_HOOK_URL is not configured. Skipping."
          fi
